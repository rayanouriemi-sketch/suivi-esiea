<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suivi ESIEA — Rayan</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    :root {
      --bg: #0c0e14;
      --bg-surface: #12151e;
      --bg-card: #181c28;
      --bg-card-hover: #1e2336;
      --bg-elevated: #222840;
      --text: #e8eaf0;
      --text-secondary: #8b90a0;
      --text-dim: #555a6e;
      --border: #252a3a;
      --border-subtle: #1e2230;
      --accent: #6c8cff;
      --accent-glow: rgba(108, 140, 255, 0.15);
      --accent-dim: #3a4a8a;
      --compris: #34d399;
      --compris-bg: rgba(52, 211, 153, 0.1);
      --compris-glow: rgba(52, 211, 153, 0.25);
      --en-cours: #fbbf24;
      --en-cours-bg: rgba(251, 191, 36, 0.1);
      --en-cours-glow: rgba(251, 191, 36, 0.25);
      --pas-commence: #64748b;
      --pas-commence-bg: rgba(100, 116, 139, 0.1);
      --tag-cours: #60a5fa;
      --tag-cours-bg: rgba(96, 165, 250, 0.12);
      --tag-tutorat: #f472b6;
      --tag-tutorat-bg: rgba(244, 114, 182, 0.12);
      --tag-both: #a78bfa;
      --tag-both-bg: rgba(167, 139, 250, 0.12);
      --ring-track: #1e2336;
      --radius: 12px;
      --radius-lg: 16px;
      --shadow-card: 0 2px 12px rgba(0,0,0,0.25), 0 0 0 1px var(--border);
      --shadow-glow: 0 0 30px rgba(108, 140, 255, 0.06);
      --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    :root[data-theme="light"] {
      --bg: #f4f5f7;
      --bg-surface: #ebedf2;
      --bg-card: #ffffff;
      --bg-card-hover: #f8f9fb;
      --bg-elevated: #f0f1f5;
      --text: #1a1d2e;
      --text-secondary: #5c6070;
      --text-dim: #9ca0ae;
      --border: #dddfe6;
      --border-subtle: #e8eaf0;
      --accent: #4a6cf7;
      --accent-glow: rgba(74, 108, 247, 0.1);
      --accent-dim: #c4d0fc;
      --compris: #16a368;
      --compris-bg: rgba(22, 163, 104, 0.08);
      --compris-glow: rgba(22, 163, 104, 0.15);
      --en-cours: #d97706;
      --en-cours-bg: rgba(217, 119, 6, 0.08);
      --en-cours-glow: rgba(217, 119, 6, 0.15);
      --pas-commence: #94a3b8;
      --pas-commence-bg: rgba(148, 163, 184, 0.1);
      --tag-cours: #3b82f6;
      --tag-cours-bg: rgba(59, 130, 246, 0.1);
      --tag-tutorat: #ec4899;
      --tag-tutorat-bg: rgba(236, 72, 153, 0.1);
      --tag-both: #8b5cf6;
      --tag-both-bg: rgba(139, 92, 246, 0.1);
      --ring-track: #e2e4ea;
      --shadow-card: 0 1px 4px rgba(0,0,0,0.06), 0 0 0 1px var(--border);
      --shadow-glow: none;
    }

    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        --bg: #f4f5f7;
        --bg-surface: #ebedf2;
        --bg-card: #ffffff;
        --bg-card-hover: #f8f9fb;
        --bg-elevated: #f0f1f5;
        --text: #1a1d2e;
        --text-secondary: #5c6070;
        --text-dim: #9ca0ae;
        --border: #dddfe6;
        --border-subtle: #e8eaf0;
        --accent: #4a6cf7;
        --accent-glow: rgba(74, 108, 247, 0.1);
        --accent-dim: #c4d0fc;
        --compris: #16a368;
        --compris-bg: rgba(22, 163, 104, 0.08);
        --compris-glow: rgba(22, 163, 104, 0.15);
        --en-cours: #d97706;
        --en-cours-bg: rgba(217, 119, 6, 0.08);
        --en-cours-glow: rgba(217, 119, 6, 0.15);
        --pas-commence: #94a3b8;
        --pas-commence-bg: rgba(148, 163, 184, 0.1);
        --tag-cours: #3b82f6;
        --tag-cours-bg: rgba(59, 130, 246, 0.1);
        --tag-tutorat: #ec4899;
        --tag-tutorat-bg: rgba(236, 72, 153, 0.1);
        --tag-both: #8b5cf6;
        --tag-both-bg: rgba(139, 92, 246, 0.1);
        --ring-track: #e2e4ea;
        --shadow-card: 0 1px 4px rgba(0,0,0,0.06), 0 0 0 1px var(--border);
        --shadow-glow: none;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      padding-block: 32px 48px;
      padding-inline: 20px;
      max-width: 900px;
      margin: 0 auto;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── HEADER ─── */
    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 32px;
      gap: 16px;
    }
    .header-left h1 {
      font-family: 'Space Grotesk', system-ui, sans-serif;
      font-weight: 700;
      font-size: 1.75rem;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }
    .header-left h1 .accent-text { color: var(--accent); }
    .header-sub {
      color: var(--text-secondary);
      font-size: 0.82rem;
      margin-top: 6px;
      line-height: 1.5;
    }
    .semester-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 6px;
      background: var(--accent-glow);
      color: var(--accent);
      border: 1px solid var(--accent-dim);
      letter-spacing: 0.04em;
    }
    .semester-badge::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse-dot 2s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* ─── GLOBAL PROGRESS ─── */
    .global-progress {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 24px;
      align-items: center;
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-card);
    }
    .ring-container {
      position: relative;
      width: 100px;
      height: 100px;
    }
    .ring-svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }
    .ring-track { fill: none; stroke: var(--ring-track); stroke-width: 7; }
    .ring-fill {
      fill: none;
      stroke-width: 7;
      stroke-linecap: round;
      transition: stroke-dashoffset 1s cubic-bezier(0.4, 0, 0.2, 1), stroke 0.3s;
    }
    .ring-label {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .ring-pct {
      font-family: 'Space Grotesk', system-ui, sans-serif;
      font-weight: 700;
      font-size: 1.5rem;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .ring-pct-sign {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-secondary);
    }
    .ring-caption {
      font-size: 0.62rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-top: 3px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .stat-tile {
      background: var(--bg-surface);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .stat-tile-value {
      font-family: 'Space Grotesk', system-ui, sans-serif;
      font-weight: 700;
      font-size: 1.4rem;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .stat-tile-label {
      font-size: 0.68rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    /* ─── FILTER BAR ─── */
    .filter-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .filter-btn {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 0.75rem;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition);
      white-space: nowrap;
    }
    .filter-btn:hover {
      border-color: var(--accent);
      color: var(--text);
    }
    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .filter-count {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      opacity: 0.7;
      margin-left: 3px;
    }

    /* ─── SUBJECT CARDS ─── */
    .subject-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      margin-bottom: 10px;
      box-shadow: var(--shadow-card);
      overflow: hidden;
      transition: all var(--transition);
    }
    .subject-card:hover {
      box-shadow: var(--shadow-card), var(--shadow-glow);
      transform: translateY(-1px);
    }
    .subject-card.open {
      box-shadow: var(--shadow-card), var(--shadow-glow);
    }

    .subject-header {
      display: grid;
      grid-template-columns: 44px 1fr auto auto;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      cursor: pointer;
      user-select: none;
      transition: background var(--transition);
    }
    .subject-header:hover { background: var(--bg-card-hover); }

    .subject-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      background: var(--bg-elevated);
      transition: transform var(--transition);
    }
    .subject-card:hover .subject-icon { transform: scale(1.05); }

    .subject-info { min-width: 0; }
    .subject-name {
      font-family: 'Space Grotesk', system-ui, sans-serif;
      font-weight: 600;
      font-size: 0.95rem;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .subject-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 3px;
    }
    .subject-prof {
      font-size: 0.72rem;
      color: var(--text-dim);
    }
    .subject-topic-count {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.62rem;
      color: var(--text-dim);
      padding: 1px 6px;
      background: var(--bg-elevated);
      border-radius: 4px;
    }

    .subject-progress-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .mini-bar {
      width: 72px;
      height: 6px;
      background: var(--ring-track);
      border-radius: 3px;
      overflow: hidden;
      display: flex;
    }
    .mini-bar-seg { height: 100%; transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
    .progress-pct {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text-secondary);
      min-width: 36px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .chevron-icon {
      width: 18px;
      height: 18px;
      color: var(--text-dim);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      flex-shrink: 0;
    }
    .subject-card.open .chevron-icon { transform: rotate(180deg); }

    /* ─── TOPIC LIST (animated) ─── */
    .topic-list {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .subject-card.open .topic-list {
      max-height: 2000px;
    }
    .topic-list-inner {
      border-top: 1px solid var(--border-subtle);
    }

    .topic-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 18px 10px 76px;
      font-size: 0.84rem;
      border-bottom: 1px solid var(--border-subtle);
      transition: background var(--transition);
    }
    .topic-row:last-child { border-bottom: none; }
    .topic-row:hover { background: var(--bg-card-hover); }

    .topic-status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .topic-status-dot.compris { background: var(--compris); box-shadow: 0 0 6px var(--compris-glow); }
    .topic-status-dot.en_cours { background: var(--en-cours); box-shadow: 0 0 6px var(--en-cours-glow); }
    .topic-status-dot.pas_commence { background: var(--pas-commence); }

    .topic-name { flex: 1; min-width: 0; line-height: 1.4; }

    .source-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.6rem;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 4px;
      white-space: nowrap;
      flex-shrink: 0;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    .source-cours { background: var(--tag-cours-bg); color: var(--tag-cours); }
    .source-tutorat { background: var(--tag-tutorat-bg); color: var(--tag-tutorat); }
    .source-les_deux { background: var(--tag-both-bg); color: var(--tag-both); }

    .status-pill {
      font-size: 0.65rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
      white-space: nowrap;
      flex-shrink: 0;
      letter-spacing: 0.02em;
    }
    .status-compris { background: var(--compris-bg); color: var(--compris); }
    .status-en_cours { background: var(--en-cours-bg); color: var(--en-cours); }
    .status-pas_commence { background: var(--pas-commence-bg); color: var(--pas-commence); }

    .topic-note {
      font-size: 0.7rem;
      color: var(--text-dim);
      font-style: italic;
      max-width: 150px;
      text-align: right;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ─── DOCS ─── */
    .docs-section {
      padding: 10px 18px 10px 76px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .docs-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.62rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      margin-bottom: 8px;
    }
    .doc-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--accent);
      text-decoration: none;
      padding: 5px 12px;
      border-radius: 8px;
      background: var(--accent-glow);
      border: 1px solid transparent;
      margin: 0 6px 6px 0;
      transition: all var(--transition);
    }
    .doc-link:hover {
      border-color: var(--accent-dim);
      background: var(--accent-glow);
      transform: translateY(-1px);
    }
    .doc-link svg { width: 14px; height: 14px; flex-shrink: 0; opacity: 0.7; }

    .empty-msg {
      color: var(--text-dim);
      font-style: italic;
      padding: 14px 18px 14px 76px;
      font-size: 0.84rem;
    }

    /* ─── LEGEND ─── */
    .legend {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 20px;
      padding: 14px 18px;
      background: var(--bg-card);
      border-radius: var(--radius);
      margin-bottom: 16px;
      box-shadow: var(--shadow-card);
      font-size: 0.74rem;
    }
    .legend-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      width: 100%;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-secondary);
    }
    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .legend-sep {
      width: 1px;
      height: 16px;
      background: var(--border);
    }

    /* ─── FOOTER ─── */
    .footer {
      text-align: center;
      font-size: 0.7rem;
      color: var(--text-dim);
      margin-top: 32px;
      padding-top: 20px;
      border-top: 1px solid var(--border-subtle);
    }
    .footer a {
      color: var(--accent);
      text-decoration: none;
    }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 600px) {
      body { padding-inline: 16px; }
      .header { flex-direction: column; gap: 10px; }
      .global-progress {
        grid-template-columns: 1fr;
        justify-items: center;
        text-align: center;
        gap: 16px;
        padding: 20px 16px;
      }
      .stats-grid { width: 100%; }
      .subject-header {
        grid-template-columns: 38px 1fr auto auto;
        gap: 10px;
        padding: 12px 14px;
      }
      .subject-icon { width: 38px; height: 38px; font-size: 1rem; }
      .mini-bar { width: 48px; }
      .topic-row { padding-left: 58px; gap: 6px; }
      .topic-note { display: none; }
      .docs-section { padding-left: 58px; }
      .filter-bar { gap: 6px; }
    }
    @media (max-width: 380px) {
      .stats-grid { grid-template-columns: 1fr; }
      .subject-name { font-size: 0.85rem; }
    }

    /* ─── ANIMATIONS ─── */
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-in {
      animation: fade-up 0.4s cubic-bezier(0.4, 0, 0.2, 1) both;
    }
    @media (prefers-reduced-motion: reduce) {
      .animate-in { animation: none; }
      .ring-fill { transition: none; }
      .mini-bar-seg { transition: none; }
      .semester-badge::before { animation: none; }
    }
  </style>
</head>
<body>

  <div class="header animate-in" style="animation-delay: 0s">
    <div class="header-left">
      <h1>Suivi <span class="accent-text">ESIEA</span></h1>
      <p class="header-sub">Rayan · FISA · Alternance dev C/C++ · Objectif majeure Cybersécurité</p>
    </div>
    <div class="semester-badge">S5 — 2026</div>
  </div>

  <div class="global-progress animate-in" style="animation-delay: 0.05s">
    <div class="ring-container">
      <svg class="ring-svg" viewBox="0 0 100 100">
        <circle class="ring-track" cx="50" cy="50" r="42"/>
        <circle class="ring-fill" id="ring-fill" cx="50" cy="50" r="42"
                stroke-dasharray="263.9" stroke-dashoffset="263.9"/>
      </svg>
      <div class="ring-label">
        <span class="ring-pct" id="ring-pct">0<span class="ring-pct-sign">%</span></span>
        <span class="ring-caption">compris</span>
      </div>
    </div>
    <div class="stats-grid" id="stats-grid"></div>
  </div>

  <div class="legend animate-in" style="animation-delay: 0.08s">
    <div class="legend-title">Légende</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--compris); box-shadow: 0 0 6px var(--compris-glow)"></div> Compris</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--en-cours); box-shadow: 0 0 6px var(--en-cours-glow)"></div> En cours</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--pas-commence)"></div> Pas commencé</div>
    <div class="legend-sep"></div>
    <div class="legend-item"><span class="source-tag source-cours">Cours</span> En classe</div>
    <div class="legend-item"><span class="source-tag source-tutorat">Tutorat</span> Avec Claude</div>
    <div class="legend-item"><span class="source-tag source-les_deux">Les deux</span></div>
  </div>

  <div class="filter-bar animate-in" style="animation-delay: 0.1s" id="filter-bar"></div>

  <div id="subjects"></div>
  <div class="footer" id="footer"></div>

  <script>
    var STATUS_LABELS = {
      compris: "Compris",
      en_cours: "En cours",
      pas_commence: "Pas commencé"
    };
    var SOURCE_LABELS = {
      cours: "Cours",
      tutorat: "Tutorat",
      les_deux: "Les deux"
    };

    var currentFilter = "all";
    var allSubjects = [];

    function countStats(subjects) {
      var total = 0, compris = 0, enCours = 0;
      subjects.forEach(function(s) {
        (s.topics || []).forEach(function(t) {
          total++;
          if (t.status === "compris") compris++;
          if (t.status === "en_cours") enCours++;
        });
      });
      return { total: total, compris: compris, enCours: enCours, restant: total - compris - enCours };
    }

    function renderGlobalProgress(stats) {
      var pct = stats.total ? Math.round((stats.compris / stats.total) * 100) : 0;
      var circumference = 2 * Math.PI * 42;
      var offset = circumference - (pct / 100) * circumference;

      var ring = document.getElementById("ring-fill");
      var color = pct === 100 ? "var(--compris)" : pct > 0 ? "var(--accent)" : "var(--pas-commence)";
      ring.style.stroke = color;
      setTimeout(function() { ring.style.strokeDashoffset = offset; }, 100);

      document.getElementById("ring-pct").innerHTML = pct + '<span class="ring-pct-sign">%</span>';

      document.getElementById("stats-grid").innerHTML =
        '<div class="stat-tile"><div class="stat-tile-value" style="color:var(--compris)">' + stats.compris + '</div><div class="stat-tile-label">Compris</div></div>' +
        '<div class="stat-tile"><div class="stat-tile-value" style="color:var(--en-cours)">' + stats.enCours + '</div><div class="stat-tile-label">En cours</div></div>' +
        '<div class="stat-tile"><div class="stat-tile-value" style="color:var(--text-secondary)">' + stats.restant + '</div><div class="stat-tile-label">Restant</div></div>';
    }

    function renderFilters(subjects) {
      var withTopics = subjects.filter(function(s) { return (s.topics || []).length > 0; }).length;
      var noTopics = subjects.length - withTopics;

      var bar = document.getElementById("filter-bar");
      bar.innerHTML =
        '<button class="filter-btn active" data-filter="all">Toutes<span class="filter-count">' + subjects.length + '</span></button>' +
        '<button class="filter-btn" data-filter="has-topics">Avec sujets<span class="filter-count">' + withTopics + '</span></button>' +
        '<button class="filter-btn" data-filter="no-topics">À remplir<span class="filter-count">' + noTopics + '</span></button>';

      bar.querySelectorAll(".filter-btn").forEach(function(btn) {
        btn.addEventListener("click", function() {
          bar.querySelectorAll(".filter-btn").forEach(function(b) { b.classList.remove("active"); });
          btn.classList.add("active");
          currentFilter = btn.getAttribute("data-filter");
          renderSubjects(allSubjects);
        });
      });
    }

    function filterSubjects(subjects) {
      if (currentFilter === "has-topics") return subjects.filter(function(s) { return (s.topics || []).length > 0; });
      if (currentFilter === "no-topics") return subjects.filter(function(s) { return (s.topics || []).length === 0; });
      return subjects;
    }

    function renderSubjects(subjects) {
      var filtered = filterSubjects(subjects);
      var container = document.getElementById("subjects");
      container.innerHTML = "";

      filtered.forEach(function(s, i) {
        var topics = s.topics || [];
        var done = topics.filter(function(t) { return t.status === "compris"; }).length;
        var inProg = topics.filter(function(t) { return t.status === "en_cours"; }).length;
        var pct = topics.length ? Math.round((done / topics.length) * 100) : 0;

        var card = document.createElement("div");
        card.className = "subject-card animate-in";
        card.style.animationDelay = (0.12 + i * 0.04) + "s";

        var doneFrac = topics.length ? (done / topics.length * 100) : 0;
        var progFrac = topics.length ? (inProg / topics.length * 100) : 0;

        var pdfIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>';

        var docsHtml = "";
        var docs = s.docs || [];
        if (docs.length > 0) {
          docsHtml = '<div class="docs-section"><div class="docs-title">📄 Documents</div>';
          docs.forEach(function(d) {
            docsHtml += '<a class="doc-link" href="' + d.file + '" target="_blank">' + pdfIcon + d.name + '</a>';
          });
          docsHtml += '</div>';
        }

        var topicsHtml = "";
        topics.forEach(function(t) {
          var sourceHtml = t.source ? '<span class="source-tag source-' + t.source + '">' + (SOURCE_LABELS[t.source] || t.source) + '</span>' : '';
          topicsHtml +=
            '<div class="topic-row">' +
              '<span class="topic-status-dot ' + t.status + '"></span>' +
              '<span class="topic-name">' + t.name + '</span>' +
              sourceHtml +
              (t.note ? '<span class="topic-note" title="' + t.note + '">' + t.note + '</span>' : '') +
              '<span class="status-pill status-' + t.status + '">' + (STATUS_LABELS[t.status] || t.status) + '</span>' +
            '</div>';
        });

        if (topics.length === 0 && docs.length === 0) {
          topicsHtml = '<div class="empty-msg">Programme à venir</div>';
        }

        var chevronSvg = '<svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';

        card.innerHTML =
          '<div class="subject-header">' +
            '<div class="subject-icon">' + (s.icon || "📘") + '</div>' +
            '<div class="subject-info">' +
              '<div class="subject-name">' + s.name + '</div>' +
              '<div class="subject-meta">' +
                (s.prof ? '<span class="subject-prof">Prof. ' + s.prof + '</span>' : '') +
                (topics.length > 0 ? '<span class="subject-topic-count">' + topics.length + ' sujets</span>' : '') +
              '</div>' +
            '</div>' +
            '<div class="subject-progress-area">' +
              '<div class="mini-bar">' +
                '<div class="mini-bar-seg" style="width:' + doneFrac + '%;background:var(--compris)"></div>' +
                '<div class="mini-bar-seg" style="width:' + progFrac + '%;background:var(--en-cours)"></div>' +
              '</div>' +
              '<span class="progress-pct">' + pct + '%</span>' +
            '</div>' +
            chevronSvg +
          '</div>' +
          '<div class="topic-list"><div class="topic-list-inner">' + docsHtml + topicsHtml + '</div></div>';

        card.querySelector(".subject-header").addEventListener("click", function() {
          card.classList.toggle("open");
        });

        container.appendChild(card);
      });

      document.getElementById("footer").innerHTML =
        'Mis à jour le ' + new Date().toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" }) +
        ' · <a href="https://github.com/rayanouriemi-sketch/suivi-esiea" target="_blank">GitHub</a>';
    }

    fetch("data.json")
      .then(function(r) { return r.json(); })
      .then(function(data) {
        data.sort(function(a, b) { return a.order - b.order; });
        allSubjects = data;
        var stats = countStats(data);
        renderGlobalProgress(stats);
        renderFilters(data);
        renderSubjects(data);
      })
      .catch(function(err) {
        document.getElementById("subjects").innerHTML =
          '<p style="color:var(--text-secondary);text-align:center;padding:40px;">Erreur de chargement : ' + err.message + '</p>';
      });
  </script>
</body>
</html>
